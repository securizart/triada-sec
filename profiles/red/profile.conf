# triada-sec · Red Team profile
name=red
title=Red Team (offensive)
description=Pentesting, exploitation and network auditing tooling.
apt_sources=profiles/red/apt/kali.sources
apt_prefs=profiles/red/apt/kali.pref
apt_keyfpr=profiles/red/apt/kali-archive.fpr

# --- TIER: core (always) ---
core_lists=packages/core/10-recon.list packages/core/20-web.list packages/core/30-network.list packages/core/40-password.list packages/core/50-wireless.list packages/core/60-exploitation.list

# --- TIER: default (core + these) ---
default_lists=packages/default/10-recon.list packages/default/20-vuln.list packages/default/30-active-directory.list packages/default/40-cracking.list packages/default/50-wireless.list packages/default/60-web.list packages/default/70-social.list packages/default/80-crypto-stego.list packages/default/90-fuzzing.list packages/default/100-voip.list packages/default/110-windows-resources.list packages/default/120-active-directory-extra.list packages/default/130-web-extra.list packages/default/140-recon-extra.list packages/default/150-tunneling.list packages/default/160-misc.list

# --- TIER: full (default + pipx/gem/container tools) — FUTURE ---
# See docs/FULL-TOOLS.md. Tools blocked on stable base, installed isolated:
#   crackmapexec, theharvester, wapiti, evil-winrm (gem), gvm-tools+openvas
#   (license review), bloodhound-CE (full platform + neo4j).

# Special install notes (the Phase 4 installer must honor these):
#   nikto    -> apt install nikto/kali-rolling      (Kali non-free)
#   hashcat  -> apt install --no-install-recommends hashcat
#   metasploit-framework -> pulls postgresql; run `msfdb init` post-install
debconf=wireshark-common wireshark-common/install-setuid boolean true
hardware_lists=packages/default/170-hardware-radio.list
